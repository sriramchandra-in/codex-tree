name: Dogfood

on:
  push:
    branches: [main]

# Only run one dogfood job at a time to avoid commit races.
concurrency:
  group: dogfood-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-tree:
    name: Update codex-tree for itself
    runs-on: ubuntu-latest
    # Don't run on commits made by this workflow (avoid infinite loop).
    if: "!contains(github.event.head_commit.message, '[skip dogfood]')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a token that can push back to the repo.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Check staleness
        id: check
        run: |
          OUTPUT=$(./target/release/codex-tree check --format json 2>/dev/null || true)
          STALE=$(echo "$OUTPUT" | grep -o '"is_stale":[a-z]*' | cut -d: -f2)
          echo "is_stale=${STALE:-true}" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" | head -20

      - name: Update tree
        if: steps.check.outputs.is_stale == 'true'
        run: |
          # Use intent layer if API key is available, otherwise AST only.
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Updating tree with intent + Claude layers..."
            ./target/release/codex-tree update
          else
            echo "Updating tree (AST only — no ANTHROPIC_API_KEY)..."
            ./target/release/codex-tree update --no-intent --no-claude
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Report
        run: ./target/release/codex-tree report

      - name: Commit and push updated tree
        if: steps.check.outputs.is_stale == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .codex-tree/
          if git diff --cached --quiet; then
            echo "No tree changes to commit."
          else
            git commit -m "Update .codex-tree/ knowledge tree [skip dogfood]

          Auto-generated by the dogfood workflow after source changes.

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git push
            echo "Tree updated and pushed."
          fi
