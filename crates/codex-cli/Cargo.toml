[package]
name = "codex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for generating and maintaining codex-tree knowledge trees"

[[bin]]
name = "codex-tree"
path = "src/main.rs"

[dependencies]
codex-parser = { path = "../codex-parser" }
codex-analyzer = { path = "../codex-analyzer" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
colored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
